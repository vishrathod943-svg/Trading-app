services:
  backend:
    build: ../backend
    restart: unless-stopped
    environment:
      FO_MODE: kite
      FO_DATABASE: /data/screener.db
      FO_AUTO_DATABASE: /data/automation.db
      FO_API_TOKEN: ${FO_API_TOKEN:?Set a random backend token in the private env file}
      KITE_API_KEY: ${KITE_API_KEY:?Set your Kite API key}
      KITE_ACCESS_TOKEN: ${KITE_ACCESS_TOKEN:-}
      FO_LIVE_ORDERS: ${FO_LIVE_ORDERS:-false}
    volumes:
      - trading-data:/data
    expose:
      - "8000"
    stop_grace_period: 20s
  https:
    image: caddy:2.10.0-alpine
    restart: unless-stopped
    environment:
      FO_DOMAIN: ${FO_DOMAIN:?Set the hostname pointing to this server}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - tls-data:/data
      - tls-config:/config
    depends_on:
      - backend
volumes:
  trading-data:
  tls-data:
  tls-config:
